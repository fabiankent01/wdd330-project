<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Sign Up</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .signup-container {
      max-width: 500px;
      margin: 2rem auto;
      padding: 2rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .signup-container h2 {
      text-align: center;
      color: var(--secondary-color);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--dark-grey);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--light-grey);
      border-radius: 4px;
      font-size: 1rem;
      font-family: var(--font-body);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .required {
      color: #c00;
    }

    .avatar-upload {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--light-grey);
      object-fit: cover;
      background: var(--light-grey);
    }

    .avatar-upload input[type="file"] {
      flex: 1;
    }

    .btn-primary {
      width: 100%;
      padding: 1rem;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn-primary:hover {
      background-color: var(--primary-color);
    }

    .btn-primary:disabled {
      background-color: var(--light-grey);
      cursor: not-allowed;
    }

    .message {
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      display: none;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.show {
      display: block;
    }

    .login-link {
      text-align: center;
      margin-top: 1rem;
      color: var(--dark-grey);
    }

    .login-link a {
      color: var(--secondary-color);
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      color: var(--primary-color);
    }

    .password-requirements {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <!-- Dynamic Header -->
  <div id="main-header"></div>

  <main class="divider">
    <div class="signup-container">
      <h2>Create Your Account</h2>
      
      <div id="message" class="message"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="firstName">First Name <span class="required">*</span></label>
          <input type="text" id="firstName" name="firstName" required />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name <span class="required">*</span></label>
          <input type="text" id="lastName" name="lastName" required />
        </div>

        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" required minlength="6" />
          <div class="password-requirements">Minimum 6 characters</div>
        </div>

        <div class="form-group">
          <label for="street">Street Address <span class="required">*</span></label>
          <input type="text" id="street" name="street" required />
        </div>

        <div class="form-group">
          <label for="city">City <span class="required">*</span></label>
          <input type="text" id="city" name="city" required />
        </div>

        <div class="form-group">
          <label for="state">State/Province <span class="required">*</span></label>
          <input type="text" id="state" name="state" required />
        </div>

        <div class="form-group">
          <label for="zip">ZIP/Postal Code <span class="required">*</span></label>
          <input type="text" id="zip" name="zip" required />
        </div>

        <div class="form-group">
          <label for="country">Country <span class="required">*</span></label>
          <input type="text" id="country" name="country" value="United States" required />
        </div>

        <div class="form-group">
          <label for="avatar">Profile Avatar (Optional)</label>
          <div class="avatar-upload">
            <img id="avatar-preview" class="avatar-preview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23d0d0d0'/%3E%3Ctext x='50' y='50' text-anchor='middle' dy='.3em' font-size='40' fill='%23fff'%3E?%3C/text%3E%3C/svg%3E" alt="Avatar preview" />
            <input type="file" id="avatar" name="avatar" accept="image/*" />
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">Sign Up</button>
      </form>

      <div class="login-link">
        Already have an account? <a href="../login/index.html">Log in</a>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="main-footer"></div>

  <script type="module">
    import { loadHeaderFooter } from '../js/utils.mjs';

    loadHeaderFooter();

    const form = document.getElementById('signup-form');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');
    const avatarInput = document.getElementById('avatar');
    const avatarPreview = document.getElementById('avatar-preview');

    // Avatar preview
    avatarInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          avatarPreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type} show`;
      messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideMessage() {
      messageDiv.className = 'message';
    }

    async function handleSignup(e) {
      e.preventDefault();
      hideMessage();

      // Disable submit button
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        const formData = new FormData(form);
        
        // Prepare user data
        const userData = {
          fname: formData.get('firstName'),
          lname: formData.get('lastName'),
          email: formData.get('email'),
          password: formData.get('password'),
          street: formData.get('street'),
          city: formData.get('city'),
          state: formData.get('state'),
          zip: formData.get('zip'),
          country: formData.get('country')
        };

        // Handle avatar if provided
        const avatarFile = formData.get('avatar');
        if (avatarFile && avatarFile.size > 0) {
          // Convert to base64
          const base64Avatar = await fileToBase64(avatarFile);
          userData.avatar = base64Avatar;
        }

        // Get the base URL from environment variable
        const baseURL = import.meta.env.VITE_SERVER_URL || 'http://server-nodejs.cit.byui.edu:3000/';
        
        // Post to /users endpoint
        const response = await fetch(`${baseURL}users`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(userData)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.message || `Server error: ${response.status}`);
        }

        const result = await response.json();
        
        showMessage('Account created successfully! Redirecting to login...', 'success');
        
        // Redirect to login page after 2 seconds
        setTimeout(() => {
          window.location.href = '../login/index.html';
        }, 2000);

      } catch (error) {
        console.error('Signup error:', error);
        showMessage(error.message || 'Failed to create account. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign Up';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener('submit', handleSignup);
  </script>
</body>
</html>
